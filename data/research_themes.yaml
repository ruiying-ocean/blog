# Research theme cards shown on /research/ (rendered by the `research-cards` shortcode).
# `image` is a filename inside the content/research/ page bundle.
# `desc` supports Markdown (e.g. *italics*, `code`, [links](...)).
- tag: Plankton
  title: "Plankton ecology & evolution"
  image: foram.png
  alt: "Planktic foraminifera shells under the microscope"
  desc: >-
    Plankton are tiny and abundant microorganisms in the water. I study plankton
    because they are important for understanding fundamental questions in ecology and evolution.
    I am particularly interested in calcifying zooplankton (foraminifera) whose shells form the best
    microfossil record on Earth.


- tag: Modelling
  title: "Ocean biogeochemistry modelling"
  image: planktom_npp.png
  alt: "NEMO-PlankTOM12 modelled ocean net primary production"
  desc: >-
    Plankton are important players in the carbon cycle. I develop and use global ocean biogeochemistry and Earth system models — from
    cGENIE to PlankTOM — to link plankton ecology to the cycling of carbon and
    nutrients, across the modern ocean and deep time.

- tag: Climate
  title: "Past & future climate change"
  image: lgm.png
  alt: "Last Glacial Maximum sea surface temperature map"
  desc: >-
    Climate directly influences the habitability of Earth. To understand the impacts of climate change, I use the geological
    record to study how life responds to past climate changes (from the Last Glacial Maximum to the end-Cretaceous asteroid impact). I ask what limits species'
    ability to adapt to modern warming and what determines whether they might go extinct.

- tag: Communities
  title: "Theoretical ecology"
  image: community.png
  alt: "Modelled size-structured plankton community assembling over time"
  desc: >-
    Plankton don't live alone. With theoretical models I study how
    competition, grazing, and the environment assemble plankton communities and
    govern their diversity and stability through time.
    
